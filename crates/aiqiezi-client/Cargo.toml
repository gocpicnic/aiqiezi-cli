[package]
name = "aiqiezi-client"
version = "0.1.1"
edition = "2021"
license = "AGPL-3.0"
description = "Shared Rust client library for aiqiezi-server"
repository = "https://github.com/gocpicnic/aiqiezi-cli"

[dependencies]
aiqiezi-proto = { git = "https://github.com/gocpicnic/aiqiezi-server", rev = "4640cdda083f8ddc12010763050a461b3360c093" }
anyhow = "1"
interprocess = { version = "2.4", features = ["tokio"] }
iroh = "1.0"
iroh-mdns-address-lookup = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
