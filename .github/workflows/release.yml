name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Cache Cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
      - name: Set build date (Unix)
        if: runner.os != 'Windows'
        run: echo "BUILD_DATE=$(date -u +%Y%m%d%H%M%S)" >> "$GITHUB_ENV"
      - name: Set build date (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "BUILD_DATE=$(Get-Date -AsUTC -Format yyyyMMddHHmmss)" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Build binary
        env:
          RUSTFLAGS: ${{ matrix.target == 'x86_64-pc-windows-msvc' && '-C target-feature=+crt-static' || '' }}
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.target == 'x86_64-apple-darwin' && '10.15' || '' }}
        run: cargo build --release --locked --target ${{ matrix.target }} -p aiqiezi-cli
      - name: Stage release files (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p artifacts
          cp "target/${{ matrix.target }}/release/aiqiezi" artifacts/
          cp LICENSE artifacts/
      - name: Stage release files (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/aiqiezi.exe" artifacts/
          Copy-Item LICENSE artifacts/
      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: aiqiezi-${{ matrix.target }}
          path: artifacts/*
          if-no-files-found: error

  publish:
    name: publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
      - name: Package artifacts
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y zip
          version="${GITHUB_REF_NAME#v}"
          mkdir -p release
          shopt -s nullglob
          for dir in artifacts/aiqiezi-*; do
            target="${dir#artifacts/aiqiezi-}"
            if [[ "$target" == *windows* ]]; then
              (cd "$dir" && zip -q -j "../../release/aiqiezi-${version}-${target}.zip" aiqiezi.exe LICENSE)
            else
              tar -czf "release/aiqiezi-${version}-${target}.tar.gz" -C "$dir" .
            fi
          done
          (cd release && sha256sum * > SHA256SUMS)
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" \
              --notes "Release $GITHUB_REF_NAME"
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" --clobber
